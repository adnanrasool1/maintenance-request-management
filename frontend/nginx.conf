# nginx site config for the web container: serves the Angular build and
# proxies /api to the API service on the same origin (so no CORS is needed).
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. `always` adds them to error responses too. No location
    # below uses add_header (caching uses `expires`), so every location inherits them.
    # style-src needs 'unsafe-inline' because Angular injects component styles as
    # <style> elements at runtime. Scripts are 'self' only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # API: keep the /api prefix (the API's routes start with /api).
    # The upstream is a variable, so nginx resolves `api` per request through
    # Docker's embedded DNS instead of at startup. The container therefore starts
    # even when the API isn't up (or doesn't exist); /api then returns 502.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        # $http_host keeps the port (e.g. localhost:8080), so absolute URLs the API builds stay correct.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output (outputHashing: all): cache for a year. A missing file
    # is a 404, not index.html.
    location ~* \.(?:js|css)$ {
        expires 1y;
        try_files $uri =404;
    }

    # The app shell is always revalidated, so a new deployment is picked up.
    location = /index.html {
        expires -1;
    }

    # SPA fallback: client-side routes (e.g. /requests/123) serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
