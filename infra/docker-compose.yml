# Local stack. Configuration comes from infra/.env (run ./setup.sh or .\setup.ps1 first).
# T0.5 adds only SQL Server; migrator, api and web are added in T5.
name: mra

services:
  sqlserver:
    # Pinned to an exact cumulative update. Never use a floating tag.
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in infra/.env}
    ports:
      - "${SQL_HOST_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # The 2022 images ship sqlcmd under mssql-tools18; -C trusts the self-signed certificate.
      # $$ escapes compose interpolation so the password is read from the container environment.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver-data:
